name: Risk labels

# Marks every PR with its path-based risk class (docs/ops/agent-policy.md).
# Marker only: the ruleset + CODEOWNERS are what gate the merge.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
